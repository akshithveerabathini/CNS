<!DOCTYPE html>
<html>
<head>
<title>CNS Cryptography Toolkit</title>

<style>
body {
    font-family: Arial;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

.section {
    background: white;
    padding: 20px;
    margin: 20px;
    width: 320px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, button {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
}

button {
    background: #007bff;
    color: white;
    border: none;
}

h2 {
    text-align: center;
    width: 100%;
}
</style>
</head>

<body>

<h2>CNS Cryptography Toolkit</h2>

<!-- ================= DIFFIE HELLMAN ================= -->
<div class="section">
<h3>Diffie-Hellman</h3>

<input type="number" id="q" placeholder="Prime Number (q)">
<input type="number" id="a" placeholder="Primitive Root (a)">
<input type="number" id="xa" placeholder="Private Key XA">
<input type="number" id="xb" placeholder="Private Key XB">

<button onclick="generateKey()">Generate Key</button>

<p id="dh_output"></p>
</div>

<!-- ================= ROW TRANSPOSITION ================= -->
<div class="section">
<h3>Row Transposition</h3>

<input type="text" id="rt_text" placeholder="Enter text">
<input type="text" id="rt_key" placeholder="Enter key (e.g., 3124)">

<button onclick="rtEncrypt()">Encrypt</button>
<button onclick="rtDecrypt()">Decrypt</button>

<p id="rt_output"></p>
</div>

<!-- ================= VIGENERE ================= -->
<div class="section">
<h3>Vigenere Cipher</h3>

<input type="text" id="vc_text" placeholder="Enter text">
<input type="text" id="vc_key" placeholder="Enter key">

<button onclick="vcEncrypt()">Encrypt</button>
<button onclick="vcDecrypt()">Decrypt</button>

<p id="vc_output"></p>
</div>

<script>

/////// DIFFIE HELLMAN ///////
function generateKey() {
    let q = parseInt(document.getElementById("q").value);
    let a = parseInt(document.getElementById("a").value);
    let XA = parseInt(document.getElementById("xa").value);
    let XB = parseInt(document.getElementById("xb").value);

    let YA = (a ** XA) % q;
    let YB = (a ** XB) % q;

    let KA = (YB ** XA) % q;
    let KB = (YA ** XB) % q;

    document.getElementById("dh_output").innerHTML =
        "YA=" + YA + ", YB=" + YB + "<br>" +
        "Shared Key: " + KA + (KA === KB ? " ✔" : " ❌");
}

/////// ROW TRANSPOSITION ///////
function rtEncrypt() {
    let text = document.getElementById("rt_text").value;
    let key = document.getElementById("rt_key").value;

    let cols = key.length;
    let rows = Math.ceil(text.length / cols);

    while (text.length < rows * cols) text += 'X';

    let matrix = [];
    let index = 0;

    for (let r = 0; r < rows; r++) {
        matrix[r] = [];
        for (let c = 0; c < cols; c++) {
            matrix[r][c] = text[index++];
        }
    }

    let result = "";
    let sorted = key.split("").sort();

    for (let i = 0; i < sorted.length; i++) {
        let col = key.indexOf(sorted[i]);
        for (let r = 0; r < rows; r++) {
            result += matrix[r][col];
        }
    }

    document.getElementById("rt_output").innerText = "Encrypted: " + result;
}

function rtDecrypt() {
    let text = document.getElementById("rt_text").value;
    let key = document.getElementById("rt_key").value;

    let cols = key.length;
    let rows = Math.ceil(text.length / cols);

    let matrix = Array.from({length: rows}, () => Array(cols).fill(''));

    let sorted = key.split("").sort();
    let index = 0;

    for (let i = 0; i < sorted.length; i++) {
        let col = key.indexOf(sorted[i]);
        for (let r = 0; r < rows; r++) {
            matrix[r][col] = text[index++];
        }
    }

    let result = "";
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            result += matrix[r][c];
        }
    }

    document.getElementById("rt_output").innerText =
        "Decrypted: " + result.replace(/X+$/, '');
}

/////// VIGENERE ///////
function vcEncrypt() {
    let text = document.getElementById("vc_text").value.toUpperCase();
    let key = document.getElementById("vc_key").value.toUpperCase();
    let result = "";
    let j = 0;

    for (let i = 0; i < text.length; i++) {
        let c = text.charCodeAt(i);
        if (c >= 65 && c <= 90) {
            let k = key.charCodeAt(j % key.length) - 65;
            result += String.fromCharCode(((c - 65 + k) % 26) + 65);
            j++;
        } else result += text[i];
    }

    document.getElementById("vc_output").innerText = result;
}

function vcDecrypt() {
    let text = document.getElementById("vc_text").value.toUpperCase();
    let key = document.getElementById("vc_key").value.toUpperCase();
    let result = "";
    let j = 0;

    for (let i = 0; i < text.length; i++) {
        let c = text.charCodeAt(i);
        if (c >= 65 && c <= 90) {
            let k = key.charCodeAt(j % key.length) - 65;
            result += String.fromCharCode(((c - 65 - k + 26) % 26) + 65);
            j++;
        } else result += text[i];
    }

    document.getElementById("vc_output").innerText = result;
}

</script>

</body>
</html>
