<!DOCTYPE html>
<html>
<head>
<title>Row Transposition Cipher</title>
<style>
body { font-family: Arial; background:#f2f2f2; display:flex; justify-content:center; }
.box { background:white; padding:20px; width:320px; margin-top:50px; }
input, button { width:100%; padding:8px; margin:5px 0; }
button { background:#007bff; color:white; border:none; }
</style>
</head>
<body>

<div class="box">
<h3>Row Transposition Cipher</h3>

<input type="text" id="text" placeholder="Enter text">
<input type="text" id="key" placeholder="Enter key (e.g., 3124)">

<button onclick="encrypt()">Encrypt</button>
<button onclick="decrypt()">Decrypt</button>

<p><b>Output:</b></p>
<p id="output"></p>
</div>

<script>
function encrypt() {
    let text = document.getElementById("text").value;
    let key = document.getElementById("key").value;

    let cols = key.length;
    let rows = Math.ceil(text.length / cols);

    while (text.length < rows * cols) text += 'X';

    let matrix = [];
    let index = 0;

    for (let r = 0; r < rows; r++) {
        matrix[r] = [];
        for (let c = 0; c < cols; c++) {
            matrix[r][c] = text[index++];
        }
    }

    let result = "";
    let sorted = key.split("").sort();

    for (let i = 0; i < sorted.length; i++) {
        let col = key.indexOf(sorted[i]);
        for (let r = 0; r < rows; r++) {
            result += matrix[r][col];
        }
    }

    document.getElementById("output").innerText = "Encrypted: " + result;
}

function decrypt() {
    let text = document.getElementById("text").value;
    let key = document.getElementById("key").value;

    let cols = key.length;
    let rows = Math.ceil(text.length / cols);

    let matrix = Array.from({length: rows}, () => Array(cols).fill(''));

    let sorted = key.split("").sort();
    let index = 0;

    for (let i = 0; i < sorted.length; i++) {
        let col = key.indexOf(sorted[i]);
        for (let r = 0; r < rows; r++) {
            matrix[r][col] = text[index++];
        }
    }

    let result = "";
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            result += matrix[r][c];
        }
    }

    document.getElementById("output").innerText = "Decrypted: " + result.replace(/X+$/, '');
}
</script>

</body>
</html>
