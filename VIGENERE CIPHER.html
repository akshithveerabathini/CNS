<!DOCTYPE html>
<html>
<head>
<title>Vigenere Cipher</title>
<style>
body { font-family: Arial; background:#f2f2f2; display:flex; justify-content:center; }
.box { background:white; padding:20px; width:300px; margin-top:50px; }
input, button { width:100%; padding:8px; margin:5px 0; }
button { background:#007bff; color:white; border:none; }
</style>
</head>
<body>

<div class="box">
<h3>Vigenere Cipher</h3>

<input type="text" id="text" placeholder="Enter text">
<input type="text" id="key" placeholder="Enter key">

<button onclick="encrypt()">Encrypt</button>
<button onclick="decrypt()">Decrypt</button>

<p><b>Output:</b></p>
<p id="output"></p>
</div>

<script>
function encrypt() {
    let text = document.getElementById("text").value.toUpperCase();
    let key = document.getElementById("key").value.toUpperCase();
    let result = "";
    let j = 0;

    for (let i = 0; i < text.length; i++) {
        let c = text.charCodeAt(i);
        if (c >= 65 && c <= 90) {
            let k = key.charCodeAt(j % key.length) - 65;
            result += String.fromCharCode(((c - 65 + k) % 26) + 65);
            j++;
        } else result += text[i];
    }
    document.getElementById("output").innerText = result;
}

function decrypt() {
    let text = document.getElementById("text").value.toUpperCase();
    let key = document.getElementById("key").value.toUpperCase();
    let result = "";
    let j = 0;

    for (let i = 0; i < text.length; i++) {
        let c = text.charCodeAt(i);
        if (c >= 65 && c <= 90) {
            let k = key.charCodeAt(j % key.length) - 65;
            result += String.fromCharCode(((c - 65 - k + 26) % 26) + 65);
            j++;
        } else result += text[i];
    }
    document.getElementById("output").innerText = result;
}
</script>

</body>
</html>
