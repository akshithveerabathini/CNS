<!DOCTYPE html>
<html>
<head>
<title>Diffie-Hellman Key Exchange</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    padding: 40px;
}

.container {
    display: flex;
    gap: 30px;
}

.panel {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
}

button {
    width: 100%;
    padding: 10px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.output p {
    margin: 5px 0;
}

.valid {
    color: green;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">

    <!-- INPUT PANEL -->
    <div class="panel">
        <h3>Diffie-Hellman Input</h3>

        <label>Prime Number (q):</label>
        <input type="number" id="q" placeholder="Enter prime number">

        <label>Primitive Root (a):</label>
        <input type="number" id="a" placeholder="Enter base">

        <label>Private Key (XA):</label>
        <input type="number" id="xa" placeholder="Enter private key A">

        <label>Private Key (XB):</label>
        <input type="number" id="xb" placeholder="Enter private key B">

        <button onclick="generateKey()">Generate Key</button>
    </div>

    <!-- OUTPUT PANEL -->
    <div class="panel output">
        <h3>Output</h3>

        <p><b>Public Keys:</b></p>
        <p id="public"></p>

        <p><b>Private Keys:</b></p>
        <p id="private"></p>

        <p><b>Shared Keys:</b></p>
        <p id="shared"></p>

        <p><b>Verification:</b></p>
        <p id="verify"></p>
    </div>

</div>

<script>
function generateKey() {
    let q = parseInt(document.getElementById("q").value);
    let a = parseInt(document.getElementById("a").value);
    let XA = parseInt(document.getElementById("xa").value);
    let XB = parseInt(document.getElementById("xb").value);

    // Validation
    if (isNaN(q) || isNaN(a) || isNaN(XA) || isNaN(XB)) {
        alert("Please enter all values");
        return;
    }

    // Public keys
    let YA = (a ** XA) % q;
    let YB = (a ** XB) % q;

    // Shared keys
    let KA = (YB ** XA) % q;
    let KB = (YA ** XB) % q;

    // Display
    document.getElementById("public").innerHTML =
        "YA = (a^XA mod q) = " + YA + "<br>" +
        "YB = (a^XB mod q) = " + YB;

    document.getElementById("private").innerHTML =
        "XA = " + XA + ", XB = " + XB;

    document.getElementById("shared").innerHTML =
        "KA = " + KA + "<br>" +
        "KB = " + KB;

    if (KA === KB) {
        document.getElementById("verify").innerHTML =
            "<span class='valid'>✔ Keys Match! Shared Key = " + KA + "</span>";
    } else {
        document.getElementById("verify").innerHTML =
            "<span style='color:red'>✘ Keys Do Not Match</span>";
    }
}
</script>

</body>
</html>
